<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Converter</title>
    <!-- Figtree Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS with Shadcn Colors -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ["class"],
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Figtree', 'sans-serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'Liberation Mono', 'Courier New', 'monospace'],
                    },
                    colors: {
                        border: "#e2e8f0",
                        input: "#e2e8f0",
                        ring: "#0f172a",
                        background: "#ffffff",
                        foreground: "#0f172a",
                        primary: {
                            DEFAULT: "#0f172a",
                            foreground: "#f8fafc",
                        },
                        secondary: {
                            DEFAULT: "#f1f5f9",
                            foreground: "#0f172a",
                        },
                        destructive: {
                            DEFAULT: "#ef4444",
                            foreground: "#f8fafc",
                        },
                        muted: {
                            DEFAULT: "#f1f5f9",
                            foreground: "#64748b",
                        },
                        accent: {
                            DEFAULT: "#f1f5f9",
                            foreground: "#0f172a",
                        },
                        popover: {
                            DEFAULT: "#ffffff",
                            foreground: "#0f172a",
                        },
                        card: {
                            DEFAULT: "#ffffff",
                            foreground: "#0f172a",
                        },
                    },
                    borderRadius: {
                        lg: "0.5rem",
                        md: "calc(0.5rem - 2px)",
                        sm: "calc(0.5rem - 4px)",
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        .lucide {
            display: inline-block;
            vertical-align: middle;
            color: currentColor;
        }

        .loader {
            border: 3px solid #e2e8f0;
            border-radius: 50%;
            border-top: 3px solid #0f172a;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 100% center;
            }

            100% {
                background-position: -100% center;
            }
        }

        .shimmer-text {
            background-image: var(--bg), linear-gradient(var(--base-color), var(--base-color));
            background-size: 250% 100%, auto;
            background-repeat: no-repeat, padding-box;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: shimmer 3s linear infinite;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-50 font-sans antialiased p-4 md:p-8">
    <div class="mx-auto max-w-6xl space-y-6">
        <!-- Header -->
        <div class="space-y-2 pb-4">
            <h1 class="text-3xl font-bold tracking-tight flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-code-2 text-primary">
                    <path d="m18 16 4-4-4-4" />
                    <path d="m6 8-4 4 4 4" />
                    <path d="m14.5 4-5 16" />
                </svg>
                Language Converter
            </h1>
            <p class="text-muted-foreground font-medium">Seamlessly translate code between programming languages using
                AI.</p>
        </div>

        <!-- Main Content (Two Columns) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">

            <!-- Source Card -->
            <div
                class="rounded-xl border border-border bg-card shadow-sm overflow-hidden flex flex-col h-[400px] md:h-[500px]">
                <div class="p-4 border-b border-border bg-slate-50/50 space-y-2">
                    <label class="block text-sm font-semibold text-foreground">Source Language</label>
                    <div class="relative group">
                        <div id="sourceSearchWrapper"
                            class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background cursor-pointer focus-within:border-primary transition-colors">
                            <input type="text" id="sourceSearch"
                                class="flex-1 bg-transparent outline-none placeholder:text-muted-foreground w-full"
                                placeholder="Search language..." autocomplete="off">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-chevron-down opacity-50">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </div>
                        <div id="sourceDropdown"
                            class="hidden absolute top-full left-0 z-50 mt-1 max-h-60 w-full overflow-auto rounded-md border border-border bg-popover p-1 text-popover-foreground shadow-md animate-in fade-in-0 zoom-in-95">
                            <div class="py-2 px-3 text-xs text-muted-foreground font-medium">No results found.</div>
                        </div>
                    </div>
                    <input type="hidden" id="sourceLanguage" value="Python">
                </div>
                <div class="p-0 flex-1 relative flex flex-col overflow-hidden">
                    <textarea id="sourceCode"
                        class="flex-1 w-full p-4 resize-none bg-transparent border-0 text-sm font-mono placeholder:text-muted-foreground focus-visible:outline-none overflow-y-auto"
                        placeholder="Paste your code here..."></textarea>
                </div>
            </div>

            <!-- Target Card -->
            <div
                class="rounded-xl border border-border bg-card shadow-sm overflow-hidden flex flex-col h-[400px] md:h-[500px]">
                <div class="p-4 border-b border-border bg-slate-50/50 space-y-2">
                    <label class="block text-sm font-semibold text-foreground">Target Language</label>
                    <div class="relative group">
                        <div id="targetSearchWrapper"
                            class="flex h-10 w-full items-center justify-between rounded-md border border-input bg-background px-3 py-2 text-sm ring-offset-background cursor-pointer focus-within:border-primary transition-colors">
                            <input type="text" id="targetSearch"
                                class="flex-1 bg-transparent outline-none placeholder:text-muted-foreground w-full"
                                placeholder="Search language..." autocomplete="off">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round" class="lucide lucide-chevron-down opacity-50">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </div>
                        <div id="targetDropdown"
                            class="hidden absolute top-full left-0 z-50 mt-1 max-h-60 w-full overflow-auto rounded-md border border-border bg-popover p-1 text-popover-foreground shadow-md animate-in fade-in-0 zoom-in-95">
                            <div class="py-2 px-3 text-xs text-muted-foreground font-medium">No results found.</div>
                        </div>
                    </div>
                    <input type="hidden" id="targetLanguage" value="JavaScript">
                </div>
                <div class="p-0 flex-1 relative bg-slate-50/30 flex flex-col overflow-hidden">
                    <textarea id="targetCode"
                        class="flex-1 w-full p-4 resize-none bg-transparent border-0 text-sm font-mono text-foreground placeholder:text-muted-foreground focus-visible:outline-none overflow-y-auto"
                        placeholder="Converted code will appear here..." readonly></textarea>
                </div>
            </div>

        </div>

        <!-- Actions -->
        <div class="flex flex-col items-center justify-center space-y-4 pt-2">
            <button id="convertBtn"
                class="inline-flex items-center justify-center whitespace-nowrap rounded-md text-sm font-semibold ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-11 px-8 py-2 shadow-sm gap-2">
                Convert Code
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-arrow-right-left">
                    <path d="m16 3 4 4-4 4" />
                    <path d="M20 7H4" />
                    <path d="m8 21-4-4 4-4" />
                    <path d="M4 17h16" />
                </svg>
            </button>

            <div id="loadingMessage" class="hidden w-full justify-center relative py-3">
                <p class="shimmer-text relative inline-block [--base-color:#71717a] [--base-gradient-color:#000] [--bg:linear-gradient(90deg,#0000_calc(50%-var(--spread)),var(--base-gradient-color),#0000_calc(50%+var(--spread)))] dark:[--base-color:#a1a1aa] dark:[--base-gradient-color:#ffffff] font-mono text-sm tracking-wide"
                    style="--spread: 36px;">
                    Converting code...
                </p>
            </div>

            <div id="errorMessage"
                class="hidden w-full max-w-md bg-destructive/10 text-destructive border border-destructive/20 rounded-md p-4 flex gap-3 shadow-sm text-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-alert-circle shrink-0">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="12" x2="12" y1="8" y2="12" />
                    <line x1="12" x2="12.01" y1="16" y2="16" />
                </svg>
                <div id="errorText" class="font-medium"></div>
            </div>
        </div>
    </div>

    <script>
        // Global state for languages
        let allLanguages = [];

        const fetchAndPopulateLanguages = async () => {
            try {
                const response = await fetch('https://raw.githubusercontent.com/kamranahmedse/githunt/master/src/components/filters/language-filter/languages.json');
                if (response.ok) {
                    const data = await response.json();
                    allLanguages = data.map(l => l.title || l.value || l);
                } else {
                    throw new Error("Fetch failed");
                }
            } catch (err) {
                allLanguages = ["ABAP", "ActionScript", "Ada", "Agda", "Alloy", "Apex", "AppleScript", "Arduino", "Assembly", "Awk", "Bash", "BASIC", "Batch", "C", "C#", "C++", "Clojure", "CMake", "COBOL", "CoffeeScript", "ColdFusion", "Coq", "Crystal", "CSS", "D", "Dart", "Delphi", "Docker", "Elixir", "Elm", "Erlang", "F#", "Fortran", "GDScript", "Go", "GraphQL", "Groovy", "Haskell", "Haxe", "HTML", "IDL", "Idris", "Isabelle", "J", "Java", "JavaScript", "JSON", "Julia", "Kotlin", "Lisp", "Logo", "Lua", "MATLAB", "Nix", "Objective-C", "Objective-C++", "OCaml", "OpenCL", "Pascal", "Perl", "PHP", "PL/pgSQL", "PL/SQL", "PowerShell", "Prolog", "PureScript", "Python", "R", "Racket", "Reason", "Ruby", "Rust", "SAS", "Scala", "Scheme", "Scratch", "Shell", "Solidity", "SQL", "Swift", "Tcl", "TypeScript", "VBA", "Visual Basic", "Vue", "WebAssembly", "XML", "YAML", "Zig"];
            }

            allLanguages = [...new Set(allLanguages)].filter(Boolean).sort((a, b) => a.localeCompare(b));

            // Initialize defaults
            setLanguage('source', 'Python');
            setLanguage('target', 'JavaScript');

            setupCombobox('source');
            setupCombobox('target');
        };

        const setLanguage = (type, lang) => {
            document.getElementById(`${type}Language`).value = lang;
            document.getElementById(`${type}Search`).value = lang;
        };

        const setupCombobox = (type) => {
            const searchInput = document.getElementById(`${type}Search`);
            const dropdown = document.getElementById(`${type}Dropdown`);
            const wrapper = document.getElementById(`${type}SearchWrapper`);

            const renderDropdown = (filter = '') => {
                const filtered = allLanguages.filter(l => l.toLowerCase().includes(filter.toLowerCase()));
                dropdown.innerHTML = '';

                if (filtered.length === 0) {
                    dropdown.innerHTML = '<div class="py-2 px-3 text-xs text-muted-foreground font-medium">No results found.</div>';
                    return;
                }

                filtered.forEach(lang => {
                    const item = document.createElement('div');
                    item.className = "relative flex cursor-default select-none items-center rounded-sm px-2 py-1.5 text-sm outline-none hover:bg-accent hover:text-accent-foreground data-[disabled]:pointer-events-none data-[disabled]:opacity-50 cursor-pointer";
                    item.textContent = lang;
                    item.onclick = () => {
                        setLanguage(type, lang);
                        dropdown.classList.add('hidden');
                    };
                    dropdown.appendChild(item);
                });
            };

            searchInput.onfocus = () => {
                const currentVal = searchInput.value;
                searchInput.value = ''; // Clear for fresh search
                dropdown.classList.remove('hidden');
                renderDropdown('');
            };

            searchInput.oninput = (e) => {
                dropdown.classList.remove('hidden');
                renderDropdown(e.target.value);
            };

            // Close on click outside
            document.addEventListener('click', (e) => {
                if (!wrapper.contains(e.target) && !dropdown.contains(e.target)) {
                    dropdown.classList.add('hidden');
                    // Reset text to selected language if they didn't pick anything
                    searchInput.value = document.getElementById(`${type}Language`).value;
                }
            });
        };

        fetchAndPopulateLanguages();

        // Conversion Logic
        const convertBtn = document.getElementById('convertBtn');
        const sourceCode = document.getElementById('sourceCode');
        const targetCode = document.getElementById('targetCode');
        const loadingMessage = document.getElementById('loadingMessage');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        convertBtn.addEventListener('click', async () => {
            const code = sourceCode.value.trim();
            const fromLang = document.getElementById('sourceLanguage').value;
            const toLang = document.getElementById('targetLanguage').value;

            if (!code) {
                showError('Please enter some code to convert.');
                return;
            }

            try {
                convertBtn.classList.add('hidden');
                loadingMessage.classList.remove('hidden');
                loadingMessage.classList.add('flex');
                errorMessage.classList.add('hidden');
                targetCode.value = '';

                const prompt = `Convert the following ${fromLang} code to ${toLang}. Only provide the converted code without explanations:\n\n${code}`;

                const response = await fetch('https://keymorph.zeabur.app/v1/6c1b667a0e7d9c5b', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: 'smart-rotate',
                        prompt: prompt
                    })
                });

                if (!response.ok) {
                    throw new Error(`API error: ${response.status}`);
                }

                // Handle both text and json response types robustly
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    data = responseText;
                }

                let convertedCode = '';
                if (typeof data === 'string') {
                    convertedCode = data;
                } else if (data) {
                    convertedCode = data.text || data.response || data.content || data.output || '';
                    if (!convertedCode) {
                        convertedCode = JSON.stringify(data, null, 2);
                    }
                }

                // Remove markdown formatting
                convertedCode = convertedCode.replace(/```[\w+#]*\n?/g, '').replace(/```\s*$/g, '').trim();

                targetCode.value = convertedCode || 'No conversion result received.';

            } catch (error) {
                showError(`Error: ${error.message}`);
            } finally {
                convertBtn.classList.remove('hidden');
                loadingMessage.classList.add('hidden');
                loadingMessage.classList.remove('flex');
            }
        });

        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.remove('hidden');
            setTimeout(() => {
                errorMessage.classList.add('hidden');
            }, 6000);
        }
    </script>
</body>

</html>
