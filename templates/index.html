<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Language Converter</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-dark.min.css" media="(prefers-color-scheme: dark)">
</head>
<body class="dark">
    <!-- Aurora Background -->
    <div class="aurora-background">
        <div class="aurora-gradient"></div>
        <div class="aurora-gradient-2"></div>
    </div>
    
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="title">
                    <span class="icon">🔄</span>
                    Code Converter
                </h1>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main">
            <div class="converter-grid-two">
                <!-- Input Section -->
                <div class="input-section">
                    <div class="section-header">
                        <h2 class="section-title">Input Code</h2>
                        <div class="language-badge" id="inputLanguage">Paste code to detect</div>
                    </div>
                    <div class="code-container">
                        <textarea 
                            id="inputCode" 
                            class="code-textarea" 
                            placeholder="Paste your code here..."
                            spellcheck="false"
                        ></textarea>
                    </div>
                </div>


                <!-- Output Section -->
                <div class="output-section">
                    <div class="section-header">
                        <h2 class="section-title">Converted Code</h2>
                        <div class="header-controls">
                            <div class="language-selector">
                                <label for="targetLanguage" class="selector-label">Convert to:</label>
                                <select id="targetLanguage" class="language-select">
                                    <option value="javascript">JavaScript</option>
                                    <option value="python">Python</option>
                                    <option value="java">Java</option>
                                    <option value="cpp">C++</option>
                                    <option value="csharp">C#</option>
                                    <option value="go">Go</option>
                                    <option value="rust">Rust</option>
                                    <option value="php">PHP</option>
                                    <option value="ruby">Ruby</option>
                                    <option value="typescript">TypeScript</option>
                                    <option value="kotlin">Kotlin</option>
                                    <option value="swift">Swift</option>
                                </select>
                            </div>
                            
                            <button id="convertBtn" class="convert-btn">
                                <span class="btn-icon">⚡</span>
                                Convert
                            </button>
                            
                            <div class="loading" id="loading" style="display: none;">
                                <div class="spinner"></div>
                                <span>Converting...</span>
                            </div>
                            
                            <div class="output-actions">
                                <button id="copyBtn" class="action-btn" title="Copy to clipboard">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                    </svg>
                                </button>
                                <button id="downloadBtn" class="action-btn" title="Download file">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                        <polyline points="7 10 12 15 17 10"></polyline>
                                        <line x1="12" y1="15" x2="12" y2="3"></line>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="code-container">
                        <pre id="outputCode" class="code-output"><code>Your converted code will appear here...</code></pre>
                    </div>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Powered by Google Gemini AI • Built with Astra❤️</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
